name: Publish Docker images

# Builds and publishes the server/worker images that the CasaOS/ZimaOS app
# store manifest (casaos/docker-compose.yml) pulls as pre-built,
# version-pinned images from GHCR. CasaOS installs an app straight from its
# compose file with no build step and no access to this repo's source, so
# `build:` (used in deploy/compose/docker-compose.yml for a `git clone` +
# build-from-source self-hosted flow) is not an option there.
#
# Multi-arch (amd64 + arm64) on purpose: a real share of CasaOS/ZimaOS boxes
# are ARM SBCs, and declaring `architectures: [amd64, arm64]` in the
# x-casaos manifest without actually publishing an arm64 image would
# install a broken app on that hardware.
#
# Pattern adapted from this project's sibling, nodedr-pos, which already
# ships this same way.

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/worker/**"
      - "apps/web/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "deploy/docker/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.1.0). Also pushed as :latest."
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: rechvix-server
            dockerfile: deploy/docker/server.Dockerfile
          - image: rechvix-worker
            dockerfile: deploy/docker/worker.Dockerfile

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: version
        run: |
          # A release is published only by running this workflow by hand with a version (workflow_dispatch). That produces the
          # version tag and moves :latest. A plain push to main publishes only :edge and :sha-<commit>, so a version tag that the
          # CasaOS manifest pins is never overwritten by later commits.
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          SHA="sha-$(git rev-parse --short=7 HEAD)"
          # GHCR image paths must be lowercase; the GitHub org/user name is not guaranteed to be.
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMG="${{ env.REGISTRY }}/${OWNER}/${{ matrix.image }}"
          {
            echo "tags<<EOF"
            if [ -n "$VERSION" ]; then
              echo "${IMG}:${VERSION}"
              echo "${IMG}:latest"
            else
              echo "${IMG}:edge"
            fi
            echo "${IMG}:${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
