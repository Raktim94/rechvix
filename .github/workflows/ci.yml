name: CI

# Runs on every PR and every push to main (brief §73's checklist:
# gofmt/vet/staticcheck/govulncheck/unit/integration/API/E2E/docker
# build/compose config). Split into independent jobs so a frontend-only
# PR isn't blocked waiting on the Postgres-backed integration suite, and
# so a failure in one area (e.g. govulncheck flagging a new CVE) doesn't
# hide a real test failure in another.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"

jobs:
  go-static:
    name: Go — format, vet, staticcheck, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt (fails on any unformatted file)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "::error::gofmt found unformatted files (see above) — run 'gofmt -w .'"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-unit:
    name: Go — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go test (unit only — no 'integration' build tag)
        run: go test ./...

  go-integration:
    name: Go — integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # internal/platform/pgtools (Stage 16, backup/restore) shells out to
      # the real pg_dump/pg_restore binaries — TestBackup_ExportInspectRestore_RoundTrips
      # needs them on this runner's own PATH (the Testcontainers Postgres
      # below is a separate concern: that's what the dump/restore connect
      # TO, not what runs the CLI). ubuntu-latest ships an older
      # postgresql-client by default; install 18 explicitly to match the
      # Postgres version this project actually targets everywhere else.
      - name: Install postgresql-client 18
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      # Testcontainers pulls postgres:18 itself and talks to the runner's
      # Docker daemon directly — no docker-compose here, matching how
      # `go test -tags=integration ./...` already works locally per the
      # README.
      - name: go test -tags=integration
        run: go test -tags=integration ./...

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: build (includes tsc -b — strict typecheck)
        run: npm run build

  docker-build:
    name: Docker — build server/worker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deploy/docker/server.Dockerfile -t rechvix-server:ci .
      - name: Build worker image
        run: docker build -f deploy/docker/worker.Dockerfile -t rechvix-worker:ci .

  compose-config:
    name: Docker Compose — config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml deliberately requires POSTGRES_PASSWORD /
      # BILLING_APP_PASSWORD / AEAD_ENCRYPTION_KEY via Compose's `:?`
      # interpolation (no insecure default) — the right choice for a real
      # deployment, but it means `docker compose config -q` can't even
      # parse the file without SOME value present. These are throwaway,
      # CI-only placeholders that exist for exactly this one validation
      # step (never used to actually start a container here) — not real
      # secrets, and never written to deploy/compose/.env, which stays
      # gitignored for actual operators.
      - name: deploy/compose — default profile
        working-directory: deploy/compose
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          BILLING_APP_PASSWORD: ci-placeholder-not-a-real-secret
          AEAD_ENCRYPTION_KEY: ci-placeholder-not-a-real-secret
        run: docker compose config -q
      - name: deploy/compose — all profiles (redis, minio, reverse-proxy)
        working-directory: deploy/compose
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          BILLING_APP_PASSWORD: ci-placeholder-not-a-real-secret
          AEAD_ENCRYPTION_KEY: ci-placeholder-not-a-real-secret
        run: docker compose --profile redis --profile minio --profile reverse-proxy config -q
      - name: casaos
        working-directory: casaos
        run: docker compose config -q
