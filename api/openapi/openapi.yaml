openapi: 3.1.0
info:
  title: rechvix API
  version: "0.17.1"
  description: >
    Multi-company, multi-branch, multi-warehouse billing, inventory,
    accounting, and India-GST tax-management API. This spec is generated
    by reading `internal/modules/*/httpapi/handlers.go` directly — every
    path, method, and request/response shape below is verified against
    the actual Go handler code, not inferred from `docs/architecture.md`'s
    design intent. See `docs/api.md` for narrative conventions (auth,
    error envelope, money shape, pagination status) that apply across
    every endpoint below rather than being repeated per-operation.

    Coverage: this contract includes the original modules and the CRM routes
    reviewed on 22 October 2026. It is not a complete inventory of all newer
    modules. Response casing follows each handler (legacy exported Go fields
    versus explicit JSON tags); do not assume one casing across all modules.
    See docs/api.md and the handlers for routes not yet represented here.

servers:
  - url: /api/v1
    description: Same origin as the web app; also reachable directly on the configured HTTP_PORT.

security:
  - sessionCookie: []
  - apiKey: []

paths:
  /reports/tax/accountant-package:
    get:
      tags: [Reporting]
      summary: Accountant handoff preview, ZIP or workbook
      description: >
        Requires reports.view and reports.export for this exact legal entity.
        Complete company scope only; extra filters are rejected. Verified 2026
        India/Spain/UK/US workpapers, not return submission. Unknown fields stay
        blank for accountant review. Maximum 20000 documents and 100000 lines.
      parameters:
        - { name: legal_entity_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, zip, xlsx], default: json } }
      responses:
        '200':
          description: Private no-store preview or complete downloadable file with review checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [CA_REVIEW_REQUIRED, BLOCKED_ITEMS_PRESENT] }
                  document_count: { type: integer }
                  checks: { type: array, items: { type: object } }
                  boxes: { type: array, items: { type: object } }
            application/zip:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { description: Invalid company, period, format, unsupported country or export size }
        '403': { description: Missing scoped view/export permission }
        '404': { description: Company not found in tenant }
  # ============================================================
  # IDENTITY — auth, sessions, MFA, password reset, API keys
  # apps/server/main.go mounts these both inside and outside the
  # RequireAuthOrAPIKey group; see each operation's `security` override.
  # ============================================================
  /auth/bootstrap:
    post:
      tags: [Identity]
      summary: First-run setup — creates the first organisation, legal entity, branch, warehouse, and owner user.
      description: >
        Only reachable when the server was started with ENABLE_BOOTSTRAP=true
        (apps/server/main.go) — a real deployment disables this once initial
        setup is done, since it has no permission check by definition.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_name, default_currency_code, default_timezone, legal_entity_name, country_code, branch_code, branch_name, warehouse_code, warehouse_name, owner_email, owner_full_name, owner_password]
              properties:
                organisation_name: { type: string }
                default_currency_code: { type: string, example: INR }
                default_timezone: { type: string, example: Asia/Kolkata }
                legal_entity_name: { type: string }
                country_code: { type: string, example: IN }
                branch_code: { type: string }
                branch_name: { type: string }
                warehouse_code: { type: string }
                warehouse_name: { type: string }
                owner_email: { type: string, format: email }
                owner_full_name: { type: string }
                owner_password: { type: string, format: password }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisation_id: { type: string, format: uuid }
                  legal_entity_id: { type: string, format: uuid }
                  branch_id: { type: string, format: uuid }
                  warehouse_id: { type: string, format: uuid }
                  owner_user_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/login:
    post:
      tags: [Identity]
      summary: Log in with email + password (+ MFA code if enrolled). Sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                mfa_code: { type: string, description: Required only if the account has MFA enrolled; a first attempt without it fails with MFA_REQUIRED. }
      responses:
        "200":
          description: Logged in. Session cookie set via Set-Cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisation_id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  idle_expires_at: { type: string, format: date-time }
                  absolute_expires_at: { type: string, format: date-time }
        "401":
          description: Invalid credentials, or MFA_REQUIRED (retry with mfa_code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: RATE_LIMITED — too many attempts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/password-reset/request:
    post:
      tags: [Identity]
      summary: Request a password reset email/link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200":
          description: >
            Always 200 regardless of whether the account exists — response
            never reveals account existence.
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: if_account_exists_reset_link_sent } }

  /auth/password-reset/complete:
    post:
      tags: [Identity]
      summary: Complete a password reset using the token from the reset link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password, confirm_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password }
                confirm_password: { type: string, format: password }
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: password_reset } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/logout:
    post:
      tags: [Identity]
      summary: Log out the current session. Clears the session cookie.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: logged_out } } }

  /auth/logout-all:
    post:
      tags: [Identity]
      summary: Revoke every session for the current user (all devices).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: all_sessions_revoked } } }

  /auth/sessions:
    get:
      tags: [Identity]
      summary: List active sessions for the current user.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        created_at: { type: string, format: date-time }
                        last_seen_at: { type: string, format: date-time }
                        ip: { type: string }
                        user_agent: { type: string }

  /auth/change-password:
    post:
      tags: [Identity]
      summary: Change the current user's password. Clears the session cookie on success (re-login required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
                confirm_password: { type: string, format: password }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: password_changed } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/mfa/enroll:
    post:
      tags: [Identity]
      summary: Begin TOTP MFA enrollment — returns the secret and provisioning URI for an authenticator app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_name: { type: string }
                issuer: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  provisioning_uri: { type: string }

  /auth/mfa/verify:
    post:
      tags: [Identity]
      summary: Confirm MFA enrollment with a code from the authenticator app. Returns one-time recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "401":
          description: MFA_INVALID — wrong code.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/mfa/disable:
    post:
      tags: [Identity]
      summary: Disable MFA (requires current password as a step-up check).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current_password], properties: { current_password: { type: string, format: password } } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: mfa_disabled } } }

  /api-keys:
    post:
      tags: [Identity]
      summary: Create an API key. The raw key is returned exactly once — subsequent GETs return key_prefix only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/APIScope" }
                expires_at: { type: string, format: date-time, nullable: true }
                allowed_ip: { type: string, nullable: true, description: Single IP the key is restricted to, if set. }
      responses:
        "201":
          description: Created. `key` is the only response that ever contains the raw secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  key_prefix: { type: string }
                  scopes: { type: array, items: { $ref: "#/components/schemas/APIScope" } }
                  key: { type: string, description: Raw API key — store it now, it is never shown again. }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Identity]
      summary: List API keys for the current user (key_prefix only, never the raw key).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        key_prefix: { type: string }
                        scopes: { type: array, items: { $ref: "#/components/schemas/APIScope" } }
                        expires_at: { type: string, format: date-time, nullable: true }
                        last_used_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }

  /api-keys/{id}:
    delete:
      tags: [Identity]
      summary: Revoke an API key immediately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: revoked } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # ORGANISATION — tenant hierarchy: org / legal entity / branch / warehouse
  # Response bodies here are domain structs with NO json tags, so field
  # names serialize as Go's exact exported (PascalCase) names — unlike
  # every request body in this API, which is snake_case. Verified against
  # internal/modules/organisation/domain/domain.go.
  # ============================================================
  /organisation:
    get:
      tags: [Organisation]
      summary: Get the current user's organisation.
      responses:
        "200":
          description: OK.
          content: { application/json: { schema: { $ref: "#/components/schemas/Organisation" } } }

  /organisation/ewaybill-mode:
    put:
      tags: [Organisation]
      summary: Set the org-wide e-Way Bill mode (Stage 8c) — FREE_PORTAL (default) or AUTOMATIC_API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties: { mode: { type: string, enum: [FREE_PORTAL, AUTOMATIC_API] } }
      responses:
        "200":
          description: OK.
          content: { application/json: { schema: { $ref: "#/components/schemas/Organisation" } } }
        "400":
          description: INVALID_MODE.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /legal-entities:
    get:
      tags: [Organisation]
      summary: List legal entities in the current organisation.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties: { legal_entities: { type: array, items: { $ref: "#/components/schemas/LegalEntity" } } }
    post:
      tags: [Organisation]
      summary: Create a legal entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name, country_code, base_currency_code]
              properties:
                legal_name: { type: string }
                country_code: { type: string }
                base_currency_code: { type: string }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/LegalEntity" } } }

  /branches:
    get:
      tags: [Organisation]
      summary: List branches in the current organisation.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties: { branches: { type: array, items: { $ref: "#/components/schemas/Branch" } } }
    post:
      tags: [Organisation]
      summary: Create a branch under a legal entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_entity_id, code, name, timezone]
              properties:
                legal_entity_id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                timezone: { type: string, example: Asia/Kolkata }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Branch" } } }

  /branches/{id}/warehouses:
    get:
      tags: [Organisation]
      summary: List warehouses under a branch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: Branch ID. }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties: { warehouses: { type: array, items: { $ref: "#/components/schemas/Warehouse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /warehouses:
    post:
      tags: [Organisation]
      summary: Create a warehouse under a branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, code, name]
              properties:
                branch_id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Warehouse" } } }

  # ============================================================
  # CATALOGUE — units of measure, categories, brands, products, variants, barcodes
  # Response bodies are domain structs with no json tags (PascalCase),
  # same pattern as Organisation above. Verified against
  # internal/modules/catalogue/domain/domain.go.
  # ============================================================
  /catalogue/units:
    get:
      tags: [Catalogue]
      summary: List units of measure.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { units_of_measure: { type: array, items: { $ref: "#/components/schemas/UnitOfMeasure" } } } } } } }
    post:
      tags: [Catalogue]
      summary: Create a unit of measure.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UnitOfMeasure" } } } }

  /catalogue/unit-conversions:
    post:
      tags: [Catalogue]
      summary: "Create a unit conversion (\"1 unit of from_unit_id = factor units of to_unit_id\", e.g. BOX→PCS)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_unit_id, to_unit_id, factor]
              properties:
                from_unit_id: { type: string, format: uuid }
                to_unit_id: { type: string, format: uuid }
                factor: { type: string, description: Decimal string, e.g. "25". }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UnitConversion" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /catalogue/categories:
    get:
      tags: [Catalogue]
      summary: List categories.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { categories: { type: array, items: { $ref: "#/components/schemas/Category" } } } } } } }
    post:
      tags: [Catalogue]
      summary: Create a category (optionally nested under a parent).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, parent_id: { type: string, format: uuid, nullable: true } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }

  /catalogue/brands:
    get:
      tags: [Catalogue]
      summary: List brands.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { brands: { type: array, items: { $ref: "#/components/schemas/Brand" } } } } } } }
    post:
      tags: [Catalogue]
      summary: Create a brand.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Brand" } } } }

  /catalogue/products:
    get:
      tags: [Catalogue]
      summary: List, or search with `q`, products (Stage 3 trigram index — see docs/database.md).
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Free-text search; when present, results are capped at 20 and this behaves as a search rather than a full list." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { products: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } } }
    post:
      tags: [Catalogue]
      summary: Create a product. (A product isn't sellable until it has at least one variant — see POST /catalogue/variants.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_uom_id, name]
              properties:
                category_id: { type: string, format: uuid, nullable: true }
                brand_id: { type: string, format: uuid, nullable: true }
                base_uom_id: { type: string, format: uuid }
                name: { type: string }
                description: { type: string }
                hsn_sac_code: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }

  /catalogue/products/{id}:
    get:
      tags: [Catalogue]
      summary: Get a product by ID.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogue/products/{id}/variants:
    get:
      tags: [Catalogue]
      summary: List variants of a product.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } } } } } } }

  /catalogue/products/import:
    post:
      tags: [Catalogue]
      summary: Bulk-import products from an uploaded CSV or XLSX file.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx, tally] } }
        - { name: mapping, in: query, schema: { type: string }, description: "JSON object of Rechvix field to file column; a value starting with = is a fixed value for every row. Omit to use the suggested mapping." }
        - { name: dry_run, in: query, schema: { type: boolean, default: false }, description: Validate and report without committing any row. }
      requestBody:
        required: true
        content:
          text/xml: { schema: { type: string, format: binary } }
          text/csv: { schema: { type: string, format: binary } }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "400":
          description: INVALID_CSV / INVALID_XLSX / INVALID_FORMAT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /catalogue/products/import/inspect:
    post:
      tags: [Catalogue]
      summary: Read an uploaded file's columns and suggest how they map to the products import fields. Writes nothing.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx, tally] } }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, format: binary } }
          text/xml: { schema: { type: string, format: binary } }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
      responses:
        "200": { description: "Headers, target fields, suggested mapping (field to header), first rows and total row count.", content: { application/json: { schema: { type: object } } } }


  /catalogue/variants:
    post:
      tags: [Catalogue]
      summary: Create a variant of an existing product (SKU-level — this is what a sale/purchase line and stock movement actually reference).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, sku_code]
              properties:
                product_id: { type: string, format: uuid }
                sku_code: { type: string }
                attributes: { type: object, additionalProperties: true, description: "Free-form (size, colour, ...)." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ProductVariant" } } } }
        "409":
          description: DUPLICATE_SKU.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /catalogue/barcodes:
    post:
      tags: [Catalogue]
      summary: Attach a barcode to a variant, at a given unit (e.g. the BOX barcode vs. the PCS barcode of the same variant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id, unit_id, barcode]
              properties:
                variant_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid }
                barcode: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Barcode" } } } }

  /catalogue/barcodes/{code}:
    get:
      tags: [Catalogue]
      summary: Look up a barcode (the Sales billing screen's scan-to-add path).
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Barcode" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # CONTACTS — parties (customer/supplier/both), addresses, tax registrations
  # Verified against internal/modules/contacts/domain/domain.go.
  # ============================================================
  /contacts/parties:
    get:
      tags: [Contacts]
      summary: List, or search with `q`, parties.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Free-text (name/phone); when present, results are capped at 20." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { parties: { type: array, items: { $ref: "#/components/schemas/Party" } } } } } } }
    post:
      tags: [Contacts]
      summary: Create a party (customer, supplier, or both).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_type, legal_name]
              properties:
                party_type: { type: string, enum: [CUSTOMER, SUPPLIER, BOTH] }
                legal_name: { type: string }
                trade_name: { type: string }
                phone: { type: string }
                email: { type: string }
                currency_code: { type: string }
                credit_limit_amount: { type: string, nullable: true, description: Decimal string. }
                payment_terms_days: { type: integer, nullable: true }
                notes: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Party" } } } }
        "400":
          description: INVALID_PARTY_TYPE / LEGAL_NAME_REQUIRED / INVALID_CREDIT_LIMIT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /contacts/parties/{id}:
    get:
      tags: [Contacts]
      summary: Get a party by ID.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Party" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/parties/{id}/addresses:
    get:
      tags: [Contacts]
      summary: List a party's addresses.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { addresses: { type: array, items: { $ref: "#/components/schemas/Address" } } } } } } }
    post:
      tags: [Contacts]
      summary: Add an address to a party.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_type]
              properties:
                address_type: { type: string, enum: [BILLING, SHIPPING, WAREHOUSE, REGISTERED_OFFICE] }
                line1: { type: string }
                line2: { type: string }
                city: { type: string }
                state: { type: string }
                postal_code: { type: string }
                country_code: { type: string }
                is_default: { type: boolean }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "400":
          description: INVALID_ADDRESS_TYPE.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /contacts/parties/{id}/tax-registrations:
    get:
      tags: [Contacts]
      summary: List a party's tax registrations (e.g. GSTIN).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { tax_registrations: { type: array, items: { $ref: "#/components/schemas/TaxRegistration" } } } } } } }
    post:
      tags: [Contacts]
      summary: Add a tax registration to a party.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code, registration_number]
              properties:
                country_code: { type: string }
                registration_number: { type: string }
                state_code: { type: string }
                is_primary: { type: boolean }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TaxRegistration" } } } }
        "409":
          description: DUPLICATE_REGISTRATION.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /contacts/tax-registrations/{number}:
    get:
      tags: [Contacts]
      summary: Look up a party by its tax registration number (e.g. GSTIN reverse lookup).
      parameters: [{ name: number, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaxRegistration" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/parties/import:
    post:
      tags: [Contacts]
      summary: Bulk-import customers/suppliers from an uploaded CSV or XLSX file.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx, tally] } }
        - { name: mapping, in: query, schema: { type: string }, description: "JSON object of Rechvix field to file column; a value starting with = is a fixed value for every row. Omit to use the suggested mapping." }
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          text/xml: { schema: { type: string, format: binary } }
          text/csv: { schema: { type: string, format: binary } }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "400":
          description: INVALID_CSV / INVALID_XLSX / INVALID_FORMAT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /contacts/parties/import/inspect:
    post:
      tags: [Contacts]
      summary: Read an uploaded file's columns and suggest how they map to the customers and suppliers import fields. Writes nothing.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx, tally] } }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, format: binary } }
          text/xml: { schema: { type: string, format: binary } }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
      responses:
        "200": { description: "Headers, target fields, suggested mapping (field to header), first rows and total row count.", content: { application/json: { schema: { type: object } } } }


  # ============================================================
  # PRICING — price lists and per-variant/unit price items
  # Verified against internal/modules/pricing/domain/domain.go.
  # ============================================================
  /pricing/price-lists:
    get:
      tags: [Pricing]
      summary: List price lists.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { price_lists: { type: array, items: { $ref: "#/components/schemas/PriceList" } } } } } } }
    post:
      tags: [Pricing]
      summary: Create a price list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency_code]
              properties:
                name: { type: string }
                currency_code: { type: string }
                is_default: { type: boolean }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PriceList" } } } }

  /pricing/price-lists/{id}:
    get:
      tags: [Pricing]
      summary: Get a price list.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PriceList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /pricing/price-lists/{id}/items:
    get:
      tags: [Pricing]
      summary: List price items in a price list.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PriceListItem" } } } } } } }
    post:
      tags: [Pricing]
      summary: Set the price of a variant/unit combination in this price list.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_variant_id, unit_id, amount, currency_code]
              properties:
                product_variant_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid }
                amount: { type: string }
                currency_code: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PriceListItem" } } } }
        "400":
          description: NEGATIVE_PRICE / INVALID_AMOUNT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /pricing/price-lists/{id}/resolve:
    get:
      tags: [Pricing]
      summary: Resolve the effective price of a variant/unit in this price list (the Sales billing screen's price lookup).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variant_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: unit_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PriceListItem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # INVENTORY — append-only stock movements, materialized balances,
  # transfers, adjustments, reservations, low-stock, policies
  # Verified against internal/modules/inventory/domain/domain.go.
  # ============================================================
  /inventory/opening-stock:
    post:
      tags: [Inventory]
      summary: Record an OPENING stock movement (initial stock for a variant in a warehouse).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecordMovementRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/StockMovement" } } } }
        "400":
          description: INVALID_QUANTITY / INVALID_UNIT_COST.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /inventory/adjustments:
    post:
      tags: [Inventory]
      summary: Record a multi-line stock adjustment (ADJUSTMENT_IN/OUT, DAMAGE, EXPIRY, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, lines]
              properties:
                warehouse_id: { type: string, format: uuid }
                reason: { type: string }
                notes: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    required: [product_variant_id, unit_id, quantity, movement_type]
                    properties:
                      product_variant_id: { type: string, format: uuid }
                      unit_id: { type: string, format: uuid }
                      quantity: { type: string }
                      movement_type: { type: string, description: "One of the brief §11 movement types, e.g. ADJUSTMENT_IN, ADJUSTMENT_OUT, DAMAGE, EXPIRY." }
                      batch_code: { type: string, nullable: true }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adjustment: { $ref: "#/components/schemas/StockAdjustment" }
                  movements: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
        "400":
          description: INVALID_QUANTITY / INVALID_MOVEMENT_TYPE.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /inventory/transfers:
    post:
      tags: [Inventory]
      summary: Transfer stock between two warehouses (records paired TRANSFER_OUT/TRANSFER_IN movements atomically).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_warehouse_id, to_warehouse_id, product_variant_id, unit_id, quantity]
              properties:
                from_warehouse_id: { type: string, format: uuid }
                to_warehouse_id: { type: string, format: uuid }
                product_variant_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid }
                quantity: { type: string }
                notes: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/StockTransfer" } } } }
        "409":
          description: INSUFFICIENT_STOCK.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /inventory/reservations:
    post:
      tags: [Inventory]
      summary: Reserve stock against a reference document (e.g. an in-progress sale) so it can't be double-sold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, product_variant_id, quantity, reference_type, reference_id]
              properties:
                warehouse_id: { type: string, format: uuid }
                product_variant_id: { type: string, format: uuid }
                quantity: { type: string }
                reference_type: { type: string }
                reference_id: { type: string, format: uuid }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/StockReservation" } } } }
        "409":
          description: INSUFFICIENT_STOCK.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /inventory/reservations/{id}/release:
    post:
      tags: [Inventory]
      summary: Release a stock reservation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: warehouse_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: product_variant_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Released, no content. }

  /inventory/balances:
    get:
      tags: [Inventory]
      summary: Get the current stock balance of a variant in a warehouse.
      parameters:
        - { name: warehouse_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: product_variant_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StockBalance" } } } }

  /inventory/movements:
    get:
      tags: [Inventory]
      summary: List recent stock movements for a variant in a warehouse (most recent 50).
      parameters:
        - { name: warehouse_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: product_variant_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { movements: { type: array, items: { $ref: "#/components/schemas/StockMovement" } } } } } } }

  /inventory/low-stock:
    get:
      tags: [Inventory]
      summary: List variants at or below their reorder level in a warehouse.
      parameters:
        - { name: warehouse_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { low_stock: { type: array, items: { $ref: "#/components/schemas/StockBalance" } } } } } } }

  /inventory/policies:
    put:
      tags: [Inventory]
      summary: Set the reorder level, safety stock, and negative-stock policy for a variant in a warehouse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, product_variant_id, reorder_level, safety_stock]
              properties:
                warehouse_id: { type: string, format: uuid }
                product_variant_id: { type: string, format: uuid }
                reorder_level: { type: string }
                safety_stock: { type: string }
                allow_negative_stock: { type: boolean }
      responses:
        "204": { description: Set, no content. }

  # ============================================================
  # PURCHASES — purchase order / GRN / invoice / return / debit note
  # (one document family, document_type-parameterized, same pattern as
  # sales). Verified against internal/modules/purchases/domain/domain.go.
  # Supplier payment/credit is deliberately NOT here (docs/TODO.md Stage
  # 4 note — needs Stage 6's ledger to post against).
  # ============================================================
  /purchases/documents:
    get:
      tags: [Purchases]
      summary: List purchase documents, optionally filtered by document_type.
      parameters:
        - { name: document_type, in: query, schema: { $ref: "#/components/schemas/PurchaseDocumentType" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { documents: { type: array, items: { $ref: "#/components/schemas/PurchaseDocument" } } } } } } }
    post:
      tags: [Purchases]
      summary: Create a purchase document (DRAFT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, warehouse_id, supplier_party_id, document_type, currency_code]
              properties:
                branch_id: { type: string, format: uuid }
                warehouse_id: { type: string, format: uuid }
                supplier_party_id: { type: string, format: uuid }
                document_type: { $ref: "#/components/schemas/PurchaseDocumentType" }
                reference_document_id: { type: string, format: uuid, nullable: true, description: e.g. the PO a GRN is receiving against. }
                supplier_invoice_number: { type: string }
                supplier_invoice_date: { type: string, format: date-time, nullable: true }
                document_date: { type: string, format: date-time, nullable: true }
                currency_code: { type: string }
                notes: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseDocument" } } } }
        "400":
          description: INVALID_DOCUMENT_TYPE.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /purchases/documents/{id}:
    get:
      tags: [Purchases]
      summary: Get a purchase document with its lines.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/PurchaseDocument" }
                  lines: { type: array, items: { $ref: "#/components/schemas/PurchaseDocumentLine" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /purchases/documents/{id}/lines:
    post:
      tags: [Purchases]
      summary: Add a line to a DRAFT purchase document.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_variant_id, unit_id, quantity, unit_price]
              properties:
                product_variant_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid }
                quantity: { type: string }
                unit_price: { type: string }
                batch_code: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseDocumentLine" } } } }
        "409":
          description: DOCUMENT_NOT_DRAFT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /purchases/documents/{id}/finalize:
    post:
      tags: [Purchases]
      summary: Finalize a purchase document — posts stock (for stock-affecting types) and, since Stage 6, auto-posts the accounting journal. Immutable afterward.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseDocument" } } } }
        "409":
          description: DOCUMENT_NOT_DRAFT / EMPTY_DOCUMENT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ============================================================
  # GST (India) — admin CRUD for tax_rate_master only. Real tax
  # calculation is server-internal (taxation.CalculateAndSnapshotTx,
  # invoked by the sales module on finalize) — not a callable endpoint,
  # since a client-computed tax figure is never trusted (docs/api.md).
  # Verified against internal/modules/gstindia/domain/domain.go.
  # ============================================================
  /gst/tax-rates:
    post:
      tags: [GST]
      summary: Create a tax rate for an HSN/SAC code, effective from a date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hsn_sac_code, gst_rate, valid_from]
              properties:
                hsn_sac_code: { type: string }
                classification: { $ref: "#/components/schemas/TaxRateClassification" }
                gst_rate: { type: string, description: "Combined rate, e.g. \"18\" for 18% — never pre-split into CGST/SGST here." }
                cess_rate: { type: string, default: "0" }
                valid_from: { type: string, format: date, description: YYYY-MM-DD. }
                valid_to: { type: string, format: date, nullable: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TaxRateMaster" } } } }
        "400":
          description: INVALID_GST_RATE / INVALID_CESS_RATE / INVALID_VALID_FROM / INVALID_VALID_TO.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /gst/tax-rates/{hsn}:
    get:
      tags: [GST]
      summary: List all rate rows on file for an HSN/SAC code (every validity window, not just the currently-effective one).
      parameters: [{ name: hsn, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { tax_rates: { type: array, items: { $ref: "#/components/schemas/TaxRateMaster" } } } } } } }

  # ============================================================
  # SALES — quotation/proforma/order/challan/invoice/credit-debit-note/
  # return/recurring, one document family (document_type-parameterized).
  # Verified against internal/modules/sales/domain/domain.go and
  # internal/modules/sales/app/lookup.go.
  # ============================================================
  /legal-entities/{id}/invoice-language:
    put:
      tags: [Organisation]
      summary: Set the company invoice language default; requires settings.manage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: ["", en, es, fr, de, it, pt, nl, hi] }
      responses:
        "200": { description: Updated legal entity. }
        "400": { description: Unsupported language. }
        "403": { description: Permission denied. }

  /sales/documents:
    get:
      tags: [Sales]
      summary: List sales documents, optionally filtered by document_type.
      parameters:
        - { name: document_type, in: query, schema: { $ref: "#/components/schemas/SalesDocumentType" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { documents: { type: array, items: { $ref: "#/components/schemas/SalesDocument" } } } } } } }
    post:
      tags: [Sales]
      summary: Create a sales document (DRAFT) — the billing counter's "Start sale" call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_entity_id, branch_id, warehouse_id, customer_party_id, document_type, place_of_supply_state_code, currency_code, base_currency_code, pricing_mode]
              properties:
                legal_entity_id: { type: string, format: uuid }
                branch_id: { type: string, format: uuid }
                warehouse_id: { type: string, format: uuid }
                customer_party_id: { type: string, format: uuid }
                document_type: { $ref: "#/components/schemas/SalesDocumentType" }
                reference_document_id: { type: string, format: uuid, nullable: true, description: For a document created via convert, e.g. an invoice from a sales order. }
                issue_date: { type: string, format: date-time, nullable: true }
                due_date: { type: string, format: date-time, nullable: true }
                supply_date: { type: string, format: date-time, nullable: true }
                billing_address_id: { type: string, format: uuid, nullable: true }
                shipping_address_id: { type: string, format: uuid, nullable: true }
                customer_tax_registration_id: { type: string, format: uuid, nullable: true }
                place_of_supply_state_code: { type: string }
                salesperson_user_id: { type: string, format: uuid, nullable: true }
                price_list_id: { type: string, format: uuid, nullable: true }
                currency_code: { type: string }
                base_currency_code: { type: string }
                exchange_rate: { type: string, description: Positive company-currency units per invoice-currency unit. Required for foreign currency. }
                invoice_language: { type: string, enum: ["", en, es, fr, de, it, pt, nl, hi] }
                pricing_mode: { type: string, enum: [INCLUSIVE, EXCLUSIVE] }
                customer_reference: { type: string }
                transporter: { type: string }
                vehicle_number: { type: string }
                shipping_terms: { type: string }
                notes: { type: string }
                terms_and_conditions: { type: string }
                payment_terms_days: { type: integer }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SalesDocument" } } } }
        "400":
          description: INVALID_DOCUMENT_TYPE / INVALID_EXCHANGE_RATE.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /sales/documents/{id}:
    get:
      tags: [Sales]
      summary: Get a sales document with its lines.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/SalesDocument" }
                  lines: { type: array, items: { $ref: "#/components/schemas/SalesDocumentLine" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /sales/documents/{id}/lines:
    post:
      tags: [Sales]
      summary: Add a line to a DRAFT sales document — every call is immediately persisted (the billing screen has no unsaved client-side state).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_variant_id, unit_id, quantity, unit_price]
              properties:
                product_variant_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid }
                quantity: { type: string }
                unit_price: { type: string }
                line_discount_amount: { type: string, default: "0" }
                batch_code: { type: string }
                serial_code: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SalesDocumentLine" } } } }
        "409":
          description: DOCUMENT_NOT_DRAFT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /sales/documents/{id}/finalize:
    post:
      tags: [Sales]
      summary: >
        Finalize a sales document — one transaction that: calls the tax
        engine and snapshots the result immutably, posts inventory
        movements, auto-posts the accounting journal, and (for
        TAX_INVOICE) enqueues an e-Invoice outbox event. Immutable
        afterward (docs/architecture.md §5, §9).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SalesDocument" } } } }
        "409":
          description: DOCUMENT_NOT_DRAFT / EMPTY_DOCUMENT.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /sales/documents/{id}/convert:
    post:
      tags: [Sales]
      summary: Convert a finalized document into a new one of a different type (e.g. quotation → sales order → invoice).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [target_type], properties: { target_type: { $ref: "#/components/schemas/SalesDocumentType" } } }
      responses:
        "201": { description: Created — the new DRAFT document., content: { application/json: { schema: { $ref: "#/components/schemas/SalesDocument" } } } }
        "409":
          description: DOCUMENT_NOT_FINALIZED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /sales/documents/{id}/print:
    get:
      tags: [Sales]
      summary: Render a finalized document to PDF or browser-print HTML.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: template
          in: query
          schema: { $ref: "#/components/schemas/PrintTemplate" }
          description: Defaults to A4_GST_INVOICE.
        - { name: lang, in: query, schema: { type: string, enum: [en, es, fr, de, it, pt, nl, hi] }, description: Overrides this printed copy only. Hindi uses browser-print HTML. }
        - { name: format, in: query, schema: { type: string, enum: [html] }, description: Explicitly request browser-print HTML. Devanagari automatically selects HTML. }
      responses:
        "200":
          description: PDF bytes, or escaped self-contained UTF-8 HTML for browser printing.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/html: { schema: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }

  /sales/documents/{id}/preview:
    get:
      tags: [Sales]
      summary: The finalized document as the printed invoice shows it (seller, customer, itemised tax, totals), as JSON.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lang, in: query, schema: { type: string, enum: [en, es, fr, de, it, pt, nl, hi] } }
      responses:
        "200":
          description: Pre-formatted figures computed at finalization; nothing is recalculated.
          content:
            application/json: { schema: { type: object } }
        "404": { $ref: "#/components/responses/NotFound" }

  /sales/billing-lookup:
    get:
      tags: [Sales]
      summary: Product search + stock + price in one call — the billing counter's scan/search-to-add endpoint.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: warehouse_id, in: query, schema: { type: string, format: uuid }, description: When set, stock quantities are scoped to this warehouse. }
        - { name: document_id, in: query, schema: { type: string, format: uuid }, description: Authorised invoice whose stored rate converts base-currency catalogue prices to invoice currency. }
        - { name: price_list_id, in: query, schema: { type: string, format: uuid }, description: When set, unit_price resolves against this price list. }
      responses:
        "200":
          description: OK. Capped at 10 results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ProductID: { type: string, format: uuid }
                        ProductName: { type: string }
                        HSNSACCode: { type: string }
                        ProductVariantID: { type: string, format: uuid }
                        SKUCode: { type: string }
                        QuantityOnHand: { type: string }
                        QuantityAvailable: { type: string }
                        UnitPrice: { allOf: [{ $ref: "#/components/schemas/Money" }], nullable: true }

  # ============================================================
  # ACCOUNTING — chart of accounts, double-entry journals, receipts/
  # payments, party ledger/ageing, fiscal periods, bank accounts.
  # Journals themselves have no direct POST here — every journal is
  # created by an auto-posting call from sales/purchases finalize, never
  # hand-entered over the API (docs/adr/0003). Verified against
  # internal/modules/accounting/domain/domain.go.
  # ============================================================
  /accounting/accounts:
    get:
      tags: [Accounting]
      summary: List the chart of accounts.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Account" } } } } }

  /accounting/accounts/ensure-default-chart:
    post:
      tags: [Accounting]
      summary: Idempotently seed the default chart of accounts for the current organisation (brief §14's account list) if it doesn't exist yet.
      responses:
        "204": { description: Done (idempotent — a no-op if already seeded), no content. }

  /accounting/journals/{id}:
    get:
      tags: [Accounting]
      summary: Get a posted journal with its lines.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { $ref: "#/components/schemas/Journal" }
                  lines: { type: array, items: { $ref: "#/components/schemas/JournalLine" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounting/receipts:
    post:
      tags: [Accounting]
      summary: Record money received from a customer. Posts a balanced journal (Dr Cash/Bank, Cr Accounts Receivable) in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, amount, method]
              properties:
                party_id: { type: string, format: uuid }
                sales_document_id: { type: string, format: uuid, nullable: true, description: Optional — links the receipt to the invoice it's paying down. }
                amount: { type: string }
                bank_account_id: { type: string, format: uuid, nullable: true }
                method: { $ref: "#/components/schemas/PaymentMethod" }
                reference_number: { type: string }
                received_at: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Receipt" } } } }
        "400":
          description: UNBALANCED_JOURNAL / EMPTY_JOURNAL.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: PERIOD_LOCKED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /accounting/payments:
    post:
      tags: [Accounting]
      summary: Record money paid to a supplier. Posts a balanced journal (Dr Accounts Payable, Cr Cash/Bank) in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_id, amount, method]
              properties:
                party_id: { type: string, format: uuid }
                purchase_document_id: { type: string, format: uuid, nullable: true }
                amount: { type: string }
                bank_account_id: { type: string, format: uuid, nullable: true }
                method: { $ref: "#/components/schemas/PaymentMethod" }
                reference_number: { type: string }
                paid_at: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "409":
          description: PERIOD_LOCKED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /accounting/parties/{id}/ledger:
    get:
      tags: [Accounting]
      summary: Get a party's ledger — derived fresh from journal_lines every call, never a stored balance column.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: "YYYY-MM-DD, defaults to today." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } } } } }

  /accounting/parties/{id}/ageing:
    get:
      tags: [Accounting]
      summary: Get a party's outstanding-balance ageing (current/1-30/31-60/61-90/90+ days), oldest-first FIFO credit-to-debit matching.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgeingBucket" } } } }

  /accounting/fiscal-periods:
    get:
      tags: [Accounting]
      summary: List fiscal periods.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FiscalPeriod" } } } } }
    post:
      tags: [Accounting]
      summary: Create a fiscal period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, label]
              properties:
                start_date: { type: string, format: date-time }
                end_date: { type: string, format: date-time }
                label: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalPeriod" } } } }

  /accounting/fiscal-periods/{id}/lock:
    post:
      tags: [Accounting]
      summary: Lock a fiscal period — blocks further journal posting into it (accounting.post) unless the caller also holds accounting.override_locked_period.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Locked, no content. }

  /accounting/fiscal-periods/{id}/unlock:
    post:
      tags: [Accounting]
      summary: Unlock a fiscal period.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Unlocked, no content. }

  /accounting/bank-accounts:
    get:
      tags: [Accounting]
      summary: List bank/cash accounts.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BankAccount" } } } } }
    post:
      tags: [Accounting]
      summary: Create a bank or cash account (also creates its linked GL account).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_entity_id, name, kind, currency_code]
              properties:
                legal_entity_id: { type: string, format: uuid }
                name: { type: string }
                kind: { type: string, enum: [BANK, CASH] }
                account_number: { type: string }
                bank_name: { type: string }
                ifsc_code: { type: string }
                currency_code: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BankAccount" } } } }

  # ============================================================
  # REPORTING — dashboard + every /reports/* endpoint. Every listing
  # endpoint (all but /reports/dashboard) shares one response shape
  # (ReportTable) and one ?format= query param (internal/platform/export)
  # — the headers differ per report, documented per operation below.
  # Verified against internal/modules/reporting/httpapi/{handlers,reports}.go.
  # ============================================================
  /reports/dashboard:
    get:
      tags: [Reporting]
      summary: The 8-card dashboard summary (brief §23) — live indexed queries, not a materialized table (docs/adr/0004).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSummary" } } } }

  /reports/sales/summary:
    get:
      tags: [Reporting]
      summary: "Sales summary. Headers: Key, Documents, Taxable, Tax, Grand Total."
      parameters:
        - $ref: "#/components/parameters/ReportFilterFrom"
        - $ref: "#/components/parameters/ReportFilterTo"
        - $ref: "#/components/parameters/ReportFormat"
        - name: group_by
          in: query
          schema: { type: string, enum: [day, month, customer, product, category, salesperson, branch, warehouse], default: day }
      responses:
        "200": { $ref: "#/components/responses/ReportTableOK" }
        "400":
          description: INVALID_GROUP_BY.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /reports/sales/invoices:
    get:
      tags: [Reporting]
      summary: "Sales invoice detail. Headers: Document Number, Type, Customer, Issue Date, Status, Grand Total."
      parameters: [{ $ref: "#/components/parameters/ReportFilterFrom" }, { $ref: "#/components/parameters/ReportFilterTo" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/sales/gross-profit:
    get:
      tags: [Reporting]
      summary: >
        Gross profit by product. Headers: Product, SKU, Qty Sold, Revenue,
        Approx COGS, Approx Profit. COGS is approximate — current
        average_cost, not the historical cost at the moment of sale (a
        known, documented limitation, docs/TODO.md Stage 7).
      parameters: [{ $ref: "#/components/parameters/ReportFilterFrom" }, { $ref: "#/components/parameters/ReportFilterTo" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/purchases/summary:
    get:
      tags: [Reporting]
      summary: "Purchase summary. Headers: Key, Documents, Total. No taxable/tax breakdown yet — purchases isn't wired through the tax engine (known gap)."
      parameters:
        - $ref: "#/components/parameters/ReportFilterFrom"
        - $ref: "#/components/parameters/ReportFilterTo"
        - $ref: "#/components/parameters/ReportFormat"
        - { name: group_by, in: query, schema: { type: string, enum: [day, month, supplier, product, category, branch, warehouse], default: day } }
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/purchases/documents:
    get:
      tags: [Reporting]
      summary: "Purchase document detail. Headers: Document Number, Type, Supplier, Date, Status, Total."
      parameters: [{ $ref: "#/components/parameters/ReportFilterFrom" }, { $ref: "#/components/parameters/ReportFilterTo" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/inventory/valuation:
    get:
      tags: [Reporting]
      summary: "Stock valuation. Headers: Warehouse, Product, SKU, Qty On Hand, Avg Cost, Total Value."
      parameters: [{ name: warehouse_id, in: query, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/inventory/low-stock:
    get:
      tags: [Reporting]
      summary: "Low stock. Headers: Warehouse, Product, SKU, Qty On Hand, Reorder Level."
      parameters: [{ name: warehouse_id, in: query, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/inventory/movements:
    get:
      tags: [Reporting]
      summary: "Stock movements. Headers: Date, Warehouse, Product, SKU, Type, Quantity, Reference."
      parameters: [{ name: warehouse_id, in: query, schema: { type: string, format: uuid } }, { name: product_variant_id, in: query, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/accounting/trial-balance:
    get:
      tags: [Reporting]
      summary: "Trial balance as of a date. Headers: Code, Account, Type, Debit, Credit."
      parameters: [{ name: as_of, in: query, schema: { type: string, format: date } }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/accounting/receivables:
    get:
      tags: [Reporting]
      summary: "Org-wide receivables ageing. Headers: Party ID, Current, 1-30, 31-60, 61-90, 90+, Total."
      parameters: [{ name: as_of, in: query, schema: { type: string, format: date } }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/accounting/payables:
    get:
      tags: [Reporting]
      summary: "Org-wide payables ageing. Same shape as receivables."
      parameters: [{ name: as_of, in: query, schema: { type: string, format: date } }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/accounting/accounts/{id}/ledger:
    get:
      tags: [Reporting]
      summary: "Account ledger (cash/bank book). Headers: Date, Source, Description, Debit, Credit, Balance."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ReportFilterFrom"
        - $ref: "#/components/parameters/ReportFilterTo"
        - $ref: "#/components/parameters/ReportFormat"
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/tax/hsn-summary:
    get:
      tags: [Reporting]
      summary: "HSN summary. Headers: HSN/SAC, Taxable, CGST, SGST, IGST, UTGST, CESS, Total Tax."
      parameters: [{ $ref: "#/components/parameters/ReportFilterFrom" }, { $ref: "#/components/parameters/ReportFilterTo" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/tax/rate-summary:
    get:
      tags: [Reporting]
      summary: "Tax rate summary. Headers: Rate %, Taxable, Tax, Documents."
      parameters: [{ $ref: "#/components/parameters/ReportFilterFrom" }, { $ref: "#/components/parameters/ReportFilterTo" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  /reports/tax/gstr1:
    get:
      tags: [Reporting]
      summary: >
        GSTR-1-oriented preparation — explicitly NOT a filing submission
        (title says so in the response too). Headers: Document Number,
        Date, Supply Type, Customer GSTIN, Place of Supply, Taxable,
        CGST, SGST, IGST, CESS, Grand Total. GSTR-3B is deliberately not
        built (docs/TODO.md Stage 7 — its inward/ITC side needs
        purchases' tax-engine wiring, which doesn't exist).
      parameters: [{ $ref: "#/components/parameters/ReportFilterFrom" }, { $ref: "#/components/parameters/ReportFilterTo" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { $ref: "#/components/responses/ReportTableOK" } }

  # ============================================================
  # E-WAY BILL — free-first portal workflow (docs/architecture.md §9b,
  # Stage 8c). Mounted partly under /sales/documents/{id}/ewaybill/*
  # (document-scoped) and partly under /ewaybill (not document-scoped).
  # Verified against internal/modules/ewaybill/{domain,app,eligibility}.
  # ============================================================
  /sales/documents/{id}/ewaybill:
    get:
      tags: [EWayBill]
      summary: Evaluate (and persist) e-Way Bill eligibility/status for a finalized sales document.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligibility: { $ref: "#/components/schemas/EWayBillEligibility" }
                  record: { allOf: [{ $ref: "#/components/schemas/EWayBillRecord" }], nullable: true, description: null until a record has been created (e.g. via prepare). }

  /sales/documents/{id}/ewaybill/prepare:
    post:
      tags: [EWayBill]
      summary: Prepare the free-portal upload file from the invoice's immutable snapshot. Downloadable; the frontend also opens the real government portal in a new unproxied tab.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: The prepared file, as an attachment.
          content: { application/json: { schema: { type: string, format: binary } } }
        "409":
          description: NOT_ELIGIBLE.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /sales/documents/{id}/ewaybill/transport-info:
    post:
      tags: [EWayBill]
      summary: Fill in transport details (vehicle/transporter/distance) missing from the snapshot.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_number: { type: string, nullable: true }
                transporter_id: { type: string, nullable: true }
                transporter_name: { type: string, nullable: true }
                distance_km: { type: string, nullable: true, description: Decimal string — not derivable from sales data, genuinely user-entered. }
      responses:
        "200": { description: OK — updated eligibility., content: { application/json: { schema: { $ref: "#/components/schemas/EWayBillEligibility" } } } }

  /sales/documents/{id}/ewaybill/manual-result:
    post:
      tags: [EWayBill]
      summary: Record an e-Way Bill number obtained manually on the government portal (the universal fallback path).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ewb_number, valid_from, valid_until]
              properties:
                ewb_number: { type: string }
                valid_from: { type: string, format: date-time }
                valid_until: { type: string, format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EWayBillRecord" } } } }

  /sales/documents/{id}/ewaybill/import-result:
    post:
      tags: [EWayBill]
      summary: >
        Import an e-Way Bill result and verify it against the invoice's own
        snapshot (number/date/GSTIN/doc type) — a mismatch is rejected and
        audited, never silently linked. Accepts already-parsed fields only;
        raw file/PDF upload+parsing is not built (manual entry is the
        universal fallback today).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ewb_number, valid_from, valid_until, claimed_invoice_number, claimed_invoice_date, claimed_supplier_gstin, claimed_document_type]
              properties:
                ewb_number: { type: string }
                valid_from: { type: string, format: date-time }
                valid_until: { type: string, format: date-time }
                claimed_invoice_number: { type: string }
                claimed_invoice_date: { type: string, format: date-time }
                claimed_supplier_gstin: { type: string }
                claimed_document_type: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EWayBillRecord" } } } }
        "409":
          description: RESULT_MISMATCH — the claimed fields don't match this invoice's snapshot.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /ewaybill/portal-url:
    get:
      tags: [EWayBill]
      summary: The official government e-Way Bill portal URL — backend/env-configured, zero parameters, never user-editable.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }

  # ============================================================
  # LOGISTICS — vehicles, transporters, customer transport preferences
  # (Stage 8c). Verified against internal/modules/logistics/domain.
  # ============================================================
  /logistics/vehicles:
