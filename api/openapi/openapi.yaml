components:
  parameters:
    ReportFilterFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: YYYY-MM-DD.
    ReportFilterTo:
      name: to
      in: query
      schema: { type: string, format: date }
    ReportFormat:
      name: format
      in: query
      schema: { type: string, enum: [json, csv, xlsx, pdf], default: json }
      description: "csv/xlsx/pdf responses are attachments (Content-Disposition set); export is synchronous only — no background-job/expiring-link path yet (docs/api.md)."

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bp_session
      description: Set by POST /auth/login. Default cookie name; configurable via SESSION_COOKIE_NAME.
    apiKey:
      type: http
      scheme: bearer
      description: >
        Authorization: Bearer <key>. Effective permissions are the
        intersection of the key's declared scopes and the owning user's
        real RBAC grants — see docs/api.md.

  responses:
    ReportTableOK:
      description: OK. For format=csv/xlsx/pdf, the response is the corresponding binary/text content type as an attachment instead.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ReportTable" } }
        text/csv: { schema: { type: string, format: binary } }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        application/pdf: { schema: { type: string, format: binary } }
    BadRequest:
      description: Malformed request body or invalid field value.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: No valid session cookie or API key.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated, but lacking the required permission/scope.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource does not exist, or exists in a different organisation (never distinguished from the client's perspective).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: SESSION_INVALID }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }

    Money:
      type: object
      description: >
        amount is a STRING, always — see docs/api.md. Never parse it as a
        JS/JSON number for anything beyond display formatting.
      required: [amount, currency]
      properties:
        amount: { type: string, example: "1234.50" }
        currency: { type: string, example: INR }

    APIScope:
      type: string
      enum: [products:read, inventory:read, customers:read, customers:write, invoices:read, invoices:write, reports:read]

    Organisation:
      type: object
      description: No json tags on the Go struct — fields serialize as exact PascalCase names.
      properties:
        ID: { type: string, format: uuid }
        Name: { type: string }
        DefaultCurrencyCode: { type: string }
        DefaultTimezone: { type: string }
        EWayBillMode: { type: string, enum: [FREE_PORTAL, AUTOMATIC_API] }
        Status: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    LegalEntity:
      type: object
      properties:
        ID: { type: string, format: uuid }
        OrganisationID: { type: string, format: uuid }
        LegalName: { type: string }
        CountryCode: { type: string }
        BaseCurrencyCode: { type: string }
        GSTIN: { type: string, description: Empty string if not GST-registered — nullable in the domain model, not omitted. }
        GSTStateCode: { type: string }
        Status: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    Branch:
      type: object
      properties:
