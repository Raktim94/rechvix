<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rechvix — Server settings</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Connect to your rechvix server</h1>
      <p class="hint">
        Enter the address of your self-hosted rechvix install — e.g.
        <code>https://rechvix.example.com</code> or, for a local
        install, <code>http://localhost:8090</code>.
      </p>

      <form id="server-form">
        <input
          id="server-url"
          type="text"
          inputmode="url"
          autocomplete="url"
          placeholder="https://rechvix.example.com"
          autofocus
        />
        <button type="submit" id="connect-button">Connect</button>
      </form>
      <p id="server-error" role="alert"></p>
    </main>
  </body>
</html>
