<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rechvix</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <div id="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Starting Rechvix…</h1>
        <p class="hint">
          Setting up your local database on first launch can take a little
          longer than usual.
        </p>
      </div>

      <div id="error-state" hidden>
        <h1>Couldn't start Rechvix</h1>
        <p id="error-message" class="hint" role="alert"></p>
        <button type="button" id="retry-button">Try again</button>
      </div>
    </main>
  </body>
</html>
