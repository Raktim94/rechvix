name: rechvix

services:
  # No CasaOS install-time env vars for any secret anymore (POSTGRES_PASSWORD,
  # BILLING_APP_PASSWORD, AEAD_ENCRYPTION_KEY) — that required the user to type
  # in three strong passwords during install, and CasaOS's install path has
  # proven unreliable at actually delivering typed values into the container
  # (a real fresh install was observed reusing stale cached env values from a
  # previous, unrelated install, leaving POSTGRES_PASSWORD/BILLING_APP_PASSWORD
  # empty and postgres permanently refusing to start). Instead: postgres
  # generates all three secrets itself on first boot into a small file on a
  # bind-mounted volume shared with the other three services, which each wait
  # for that file and source it before exec'ing the real binary. Nothing to
  # type, nothing to get wrong, install and it just runs. The secrets file
  # lives under /DATA/AppData/$AppID like the database itself, so it's
  # covered by CasaOS/ZimaOS's normal AppData backup convention — losing it
  # would make stored integration credentials unrecoverable (AEAD key) and
  # orphan the existing database role passwords, same risk as losing the
  # database volume itself.
  #
  # No BAREWORD `$IDENT` shell-variable reference anywhere below (e.g. no
  # `$SECRETS_FILE`, no `. /secrets/env` followed by `$POSTGRES_PASSWORD`)
  # — only literal paths and `$(...)` command substitutions. This is the
  # second attempt at working around CasaOS's compose variable
  # interpolation, and the first attempt's fix ($$$$, four dollar signs,
  # to survive what looked like a consistent double interpolation pass)
  # turned out to be wrong in a worse way: `casaos-cli app-management
  # install` (a genuinely fresh install) really does interpolate twice,
  # but `casaos-cli app-management apply` (updating an already-installed
  # app — what every subsequent version update actually runs) only
  # interpolates ONCE. $$$$ is correct for the former and wrong for the
  # latter: one pass collapses it to literal `$$IDENT`, which the SHELL
  # then reads as `$$` (its own PID) followed by literal text `IDENT` —
  # confirmed via `docker inspect` on a real `apply`-updated container
  # showing `. "1SECRETS_FILE"` (PID 1) where `. "$SECRETS_FILE"` should
  # have been, crashing postgres. There is no single dollar-count that
  # survives both `install` and `apply` correctly, because they don't
  # agree on how many passes to run — so this avoids the question
  # entirely: `$(...)` command substitutions are unaffected by EITHER
  # pass count (confirmed via `docker inspect` under both install and
  # apply — the parenthesis never matches compose's variable-name
  # pattern, so nothing to interpolate), so every dynamic value below is
  # read via `$(sed ... /secrets/env)` at the point of use instead of
  # being sourced into a named shell variable and referenced bare.
  postgres:
    image: postgres:18
    container_name: rechvix-postgres
    hostname: rechvix-postgres
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        umask 022
        mkdir -p /secrets
        if [ ! -s /secrets/env ]; then
          {
            echo "POSTGRES_PASSWORD=$$(head -c48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c24)"
            echo "BILLING_APP_PASSWORD=$$(head -c48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c24)"
            echo "AEAD_ENCRYPTION_KEY=$$(head -c32 /dev/urandom | base64)"
          } > /secrets/.env.new
          chmod 644 /secrets/.env.new
          mv /secrets/.env.new /secrets/env
        fi
        mkdir -p /docker-entrypoint-initdb.d
        cat > /docker-entrypoint-initdb.d/01-create-runtime-role.sql <<SQL
        SELECT 'CREATE ROLE billing_app LOGIN PASSWORD ''$$(sed -n 's/^BILLING_APP_PASSWORD=//p' /secrets/env)'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'billing_app')
        \gexec
        SQL
        export POSTGRES_PASSWORD="$$(sed -n 's/^POSTGRES_PASSWORD=//p' /secrets/env)"
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_migrator
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_migrator -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rechvix
    x-casaos:
      envs: []
      volumes:
        - container: /var/lib/postgresql
          description:
            en_US: All business data — invoices, inventory, accounting, everything. Back this up.
        - container: /secrets
          description:
            en_US: Auto-generated database and encryption secrets. Back this up along with the database — losing it orphans the database and makes stored integration credentials unrecoverable.

  # restart: on-failure (not "no") because CasaOS's install path does not
  # honor the depends_on/condition below — it starts every container at
  # once, so on a fresh box this reliably hits postgres before it's ready
  # and exits once. With restart: "no" that was permanent: migrate never
  # ran again, the schema was never created, and app/worker crash-looped
  # forever waiting on tables that don't exist. on-failure (unlimited)
  # makes migrate keep retrying with Docker's own backoff until postgres
  # is actually ready, then it exits 0 and stays stopped. Same reasoning
  # covers waiting on /secrets/env below: `test -s` fails (non-zero exit)
  # until postgres has generated it, and on-failure just retries.
  migrate:
    image: ghcr.io/raktim94/rechvix-server:0.14.16
    container_name: rechvix-migrate
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        test -s /secrets/env
        export DATABASE_DSN="postgres://billing_migrator:$$(sed -n 's/^POSTGRES_PASSWORD=//p' /secrets/env)@rechvix-postgres:5432/billing?sslmode=disable"
        exec /app/server -migrate
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
    networks:
      - rechvix
    x-casaos:
      envs: []

  app:
    image: ghcr.io/raktim94/rechvix-server:0.14.16
    container_name: rechvix-app
    hostname: rechvix-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        test -s /secrets/env
        export DATABASE_DSN="postgres://billing_app:$$(sed -n 's/^BILLING_APP_PASSWORD=//p' /secrets/env)@rechvix-postgres:5432/billing?sslmode=disable"
        # billing_migrator (RLS-bypassing), NOT billing_app — see
        # deploy/compose/docker-compose.yml's identical line for why
        # backup/restore needs this and reuses the same role the migrate
        # service above connects as.
        export BACKUP_DATABASE_DSN="postgres://billing_migrator:$$(sed -n 's/^POSTGRES_PASSWORD=//p' /secrets/env)@rechvix-postgres:5432/billing?sslmode=disable"
        export AEAD_ENCRYPTION_KEY="$$(sed -n 's/^AEAD_ENCRYPTION_KEY=//p' /secrets/env)"
        exec /app/server
    environment:
      HTTP_PORT: "8080"
      DATABASE_AUTO_MIGRATE: "false"
      SESSION_COOKIE_SECURE: "false"
      ENABLE_BOOTSTRAP: "true"
    ports:
      - target: 8080
        published: "8090"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
    networks:
      - rechvix
    x-casaos:
      envs: []
      ports:
        - container: "8080"
          description:
            en_US: rechvix API
          protocol: tcp

  worker:
    image: ghcr.io/raktim94/rechvix-worker:0.14.16
    container_name: rechvix-worker
    hostname: rechvix-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        test -s /secrets/env
        export DATABASE_DSN="postgres://billing_app:$$(sed -n 's/^BILLING_APP_PASSWORD=//p' /secrets/env)@rechvix-postgres:5432/billing?sslmode=disable"
        export AEAD_ENCRYPTION_KEY="$$(sed -n 's/^AEAD_ENCRYPTION_KEY=//p' /secrets/env)"
        exec /app/worker
    environment:
      EINVOICE_PROVIDER: "mock"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
    networks:
      - rechvix
    x-casaos:
      envs: []

networks:
  rechvix:
    driver: bridge

x-casaos:
  id: com.nodedr.rechvix
  architectures:
    - amd64
    - arm64
  main: app
  author: NodeDR Infotech Private Limited
  developer: Raktim94
  category: Finance
  icon: https://cdn.jsdelivr.net/gh/Raktim94/rechvix@main/casaos/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Raktim94/rechvix@main/casaos/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Raktim94/rechvix@main/casaos/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/Raktim94/rechvix@main/casaos/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/Raktim94/rechvix@main/casaos/screenshot-3.png
  title:
    en_US: rechvix
  tagline:
    en_US: Self-hosted billing, inventory, accounting, and India GST — no subscription, no external connection required
  description:
    en_US: |
      A production-grade, multi-company, multi-branch, multi-warehouse
      billing, inventory, accounting, and tax-management platform.
      India GST / e-Invoice / e-Way Bill capable, self-hosted on your own
      hardware — no subscription, no mandatory cloud dependency, no data
      leaving your server for core operation.

      Double-entry accounting, perpetual multi-warehouse inventory, GST
      invoicing with CGST/SGST/IGST breakdown, and a free e-Way Bill
      workflow that never requires a paid government API. AGPL-3.0
      licensed, same as this project's sibling, nodedr-pos.

      Ships with a full web UI (dashboard, sales, purchases, inventory,
      contacts, accounting, GST/tax, reports, settings) — `apps/server`
      serves it directly, no separate frontend container needed.
  tips:
    before_install:
      en_US: |
        No setup needed before installing — database passwords and the
        encryption key are generated automatically on first start.

        Your data persists at `/DATA/AppData/rechvix/postgres` and
        `/DATA/AppData/rechvix/secrets`, following CasaOS/ZimaOS's
        standard backup/restore convention. Back up both together.

        First run: open the app and go to /setup to create your business
        (organisation, first branch/warehouse, and owner login).
  index: /
  scheme: http
  port_map: "8090"
  version: "0.14.16"
